version: '3.8'

services:
  mongo-node1:
    image: mongo:latest
    container_name: mongo-node1
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    networks:
      - mongo-net
    volumes:
      - mongo1_data:/data/db

  mongo-node2:
    image: mongo:latest
    container_name: mongo-node2
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27018:27017"
    networks:
      - mongo-net
    volumes:
      - mongo2_data:/data/db

  mongo-node3:
    image: mongo:latest
    container_name: mongo-node3
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27019:27017"
    networks:
      - mongo-net
    volumes:
      - mongo3_data:/data/db

networks:
  mongo-net:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
